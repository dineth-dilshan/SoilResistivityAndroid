plugins { id 'com.android.application' }

android {
    namespace 'com.pasan.soilresistivity'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pasan.soilresistivity'
        minSdk 24
        targetSdk 35
        def cloudBuild = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
        versionCode cloudBuild.toInteger()
        versionName "1.4.${cloudBuild}"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
